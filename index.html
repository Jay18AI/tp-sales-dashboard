<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TP Sales Leaderboard 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b12;--bg2:#0c1219;--bg3:#101820;--bg4:#141f2b;
  --b1:#1c2a3a;--b2:#223245;
  --t1:#d8e8f5;--t2:#6b85a0;--t3:#3d5570;
  --acc:#00d4ff;--acc2:#0095cc;
  --gold:#f5c842;--silver:#a8bcc8;--bronze:#c47c3a;
  --green:#00c896;--yellow:#f5a020;--red:#f04155;--purple:#8b5cf6;--orange:#f97316
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:13px}
/* LOADING */
#ls{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#ls.hide{display:none}
.spin{width:44px;height:44px;border:3px solid var(--b2);border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.lt{font-size:13px;color:var(--t2);letter-spacing:.5px}
/* HEADER */
.hdr{background:linear-gradient(135deg,#091420 0%,#060d16 100%);border-bottom:1px solid var(--b2);padding:0 20px;position:sticky;top:0;z-index:50}
.hdr-in{max-width:1600px;margin:0 auto;height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo-wrap{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--acc),var(--acc2));border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#000;flex-shrink:0;letter-spacing:-1px}
.brand-name{font-size:16px;font-weight:700}
.brand-sub{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:5px;padding:4px 10px;background:rgba(0,200,150,.08);border:1px solid rgba(0,200,150,.18);border-radius:20px;font-size:10px;color:var(--green);font-weight:700;letter-spacing:.5px}
.pulse{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pu 2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.upd{font-size:10px;color:var(--t3)}
.rbtn{padding:5px 12px;background:rgba(0,212,255,.07);border:1px solid rgba(0,212,255,.18);color:var(--acc);border-radius:7px;cursor:pointer;font-size:11px;font-weight:600;font-family:inherit;transition:background .15s}
.rbtn:hover{background:rgba(0,212,255,.14)}
/* MONTH BAR */
.mbar{background:var(--bg2);border-bottom:1px solid var(--b1)}
.mbar-in{max-width:1600px;margin:0 auto;display:flex;align-items:center;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.mbar-in::-webkit-scrollbar{display:none}
.mtab{padding:11px 18px;border:none;background:transparent;color:var(--t2);cursor:pointer;font-size:12px;font-weight:500;border-bottom:2px solid transparent;transition:all .15s;font-family:inherit;white-space:nowrap;flex-shrink:0}
.mtab:hover{color:var(--t1)}
.mtab.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
.cumtab{margin-left:auto;background:rgba(139,92,246,.08);border:1px solid rgba(139,92,246,.2)!important;border-bottom:1px solid rgba(139,92,246,.2)!important;border-radius:7px;color:#a78bfa!important;margin-top:7px;margin-bottom:7px;padding:5px 12px!important}
.cumtab.on{background:rgba(139,92,246,.18);color:#c4b5fd!important}
/* MAIN */
.main{max-width:1600px;margin:0 auto;padding:18px 20px}
/* CARD */
.card{background:var(--bg2);border:1px solid var(--b1);border-radius:14px;padding:18px;margin-bottom:18px}
.ctitle{font-size:14px;font-weight:700;color:var(--acc);margin-bottom:14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.cbadge{font-size:10px;padding:2px 8px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);border-radius:10px;color:#a78bfa;font-weight:600}
/* KPI GRID */
.kg{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--bg3);border:1px solid var(--b1);border-radius:11px;padding:13px 14px;position:relative;overflow:hidden}
.kpi.c-acc{border-color:rgba(0,212,255,.2);background:rgba(0,212,255,.03)}
.kpi.c-g{border-color:rgba(0,200,150,.2);background:rgba(0,200,150,.03)}
.kpi.c-y{border-color:rgba(245,160,32,.2);background:rgba(245,160,32,.03)}
.kpi.c-r{border-color:rgba(240,65,85,.2);background:rgba(240,65,85,.03)}
.kpi-ic{font-size:17px;margin-bottom:6px;line-height:1}
.kpi-v{font-size:19px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;line-height:1}
.kpi-l{font-size:9.5px;color:var(--t2);margin-top:4px;text-transform:uppercase;letter-spacing:1px}
.kpi-s{font-size:11px;margin-top:3px;font-weight:600}
.kpi-bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 0 11px 11px;transition:width .5s}
/* BREAKDOWN BAR */
.bb-wrap{margin-top:4px}
.bb-lbl{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.bb{height:34px;border-radius:8px;display:flex;overflow:hidden;border:1px solid var(--b1)}
.bb-c{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 7px}
.bb-core{background:rgba(0,212,255,.45);color:#000}
.bb-txn{background:rgba(139,92,246,.5);color:#fff}
.bb-oth{background:rgba(249,115,22,.5);color:#fff}
.lgnd{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap;font-size:11px;color:var(--t2)}
.ld{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
/* PRODUCT TABLE */
.pg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px}
.pcard{background:var(--bg3);border:1px solid var(--b1);border-radius:11px;padding:14px}
.pcard-h{font-size:10px;color:var(--t2);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;font-weight:700}
.pr{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(28,42,58,.7)}
.pr:last-child{border-bottom:none}
.pn{font-size:12px;color:var(--t1);font-weight:500}
.pr-right{display:flex;align-items:center;gap:5px}
.pbar{width:60px;height:3px;background:var(--b2);border-radius:2px;overflow:hidden}
.pbar-f{height:100%;border-radius:2px}
.pv{font-size:12px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;min-width:55px;text-align:right}
.pp{font-size:10px;color:var(--t2);min-width:36px;text-align:right}
.pu2{font-size:10px;color:var(--t3);min-width:30px;text-align:right}
/* LEADERBOARD TABS */
.ltabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ltab{padding:7px 14px;border:1px solid var(--b2);background:var(--bg3);color:var(--t2);border-radius:9px;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s;font-family:inherit;white-space:nowrap}
.ltab:hover{border-color:var(--acc);color:var(--acc)}
.ltab.on{background:rgba(0,212,255,.09);border-color:var(--acc);color:var(--acc);font-weight:600}
.lbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.srch{background:var(--bg3);border:1px solid var(--b2);color:var(--t1);padding:6px 10px;border-radius:7px;font-size:12px;width:200px;outline:none;font-family:inherit}
.srch:focus{border-color:var(--acc)}
.snote{font-size:11px;color:var(--t3);padding:6px 11px;background:rgba(0,212,255,.04);border:1px solid rgba(0,212,255,.1);border-radius:7px;margin-bottom:10px}
/* TABLE */
.twrap{border:1px solid var(--b1);border-radius:12px;overflow:hidden}
.thead-info{display:flex;align-items:center;justify-content:space-between;padding:9px 16px;background:var(--bg3);border-bottom:1px solid var(--b1);font-size:11px;color:var(--t2)}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:12px}
thead{background:var(--bg3);border-bottom:1px solid var(--b2)}
th{padding:9px 13px;text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--t3);font-weight:700;user-select:none}
th.ra{text-align:right}
tbody tr{border-bottom:1px solid rgba(28,42,58,.6);transition:background .1s}
tbody tr:hover{background:rgba(255,255,255,.015)}
tbody tr:last-child{border-bottom:none}
td{padding:9px 13px;vertical-align:middle}
/* Medal rows */
.m1{background:linear-gradient(90deg,rgba(245,200,66,.08),transparent 60%)!important;border-left:3px solid var(--gold)!important}
.m2{background:linear-gradient(90deg,rgba(168,188,200,.06),transparent 60%)!important;border-left:3px solid var(--silver)!important}
.m3{background:linear-gradient(90deg,rgba(196,124,58,.06),transparent 60%)!important;border-left:3px solid var(--bronze)!important}
/* TD helpers */
.tc{width:44px;text-align:center}
.rk{font-size:11px;color:var(--t3);font-weight:700;font-variant-numeric:tabular-nums}
.mi{font-size:18px;line-height:1}
.nm{font-weight:600;color:var(--t1);max-width:160px;overflow:hidden;text-overflow:ellipsis}
.sm{color:var(--t2);font-size:12px}
.rv{text-align:right;font-variant-numeric:tabular-nums;font-size:12px}
.rb{font-weight:700;color:var(--t1)}
.ra2{text-align:right;font-size:12px}
.cp{color:var(--acc);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.rh{color:var(--gold);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
/* SLAB BADGES */
.sl{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.sl-R{background:rgba(0,200,150,.1);color:#00c896;border:1px solid rgba(0,200,150,.18)}
.sl-A{background:rgba(0,212,255,.1);color:var(--acc);border:1px solid rgba(0,212,255,.18)}
.sl-D{background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.18)}
.sl-P{background:rgba(240,65,85,.1);color:#f04155;border:1px solid rgba(240,65,85,.18)}
.sl-W{background:rgba(245,160,32,.1);color:#f5a020;border:1px solid rgba(245,160,32,.18)}
.sl-N{background:rgba(100,181,246,.1);color:#64b5f6;border:1px solid rgba(100,181,246,.18)}
.sl-I{background:rgba(249,115,22,.1);color:#f97316;border:1px solid rgba(249,115,22,.18)}
.sl-In{background:rgba(139,92,246,.1);color:#a78bfa;border:1px solid rgba(139,92,246,.18)}
/* PROGRESS */
.pg{display:flex;align-items:center;gap:6px;min-width:82px}
.pg-bg{width:55px;height:4px;background:var(--b2);border-radius:2px;overflow:hidden;flex-shrink:0}
.pg-f{height:100%;border-radius:2px;transition:width .4s}
.pg-l{font-size:10px;width:30px;text-align:right;font-variant-numeric:tabular-nums}
/* CUTS GRID */
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.cc{background:var(--bg2);border:1px solid var(--b1);border-radius:12px;padding:16px}
.cct{font-size:12.5px;font-weight:700;margin-bottom:12px;color:var(--t1)}
.mt{width:100%;border-collapse:collapse;font-size:12px}
.mt th{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--t3);padding:4px 7px;border-bottom:1px solid var(--b1);font-weight:700;text-align:left}
.mt th.ra{text-align:right}
.mt td{padding:6px 7px;border-bottom:1px solid rgba(28,42,58,.4)}
.mt tr:last-child td{border-bottom:none}
.mt tr:hover td{background:rgba(255,255,255,.01)}
.g{color:#00c896;font-weight:600}
.y{color:#f5a020;font-weight:600}
.r2{color:#f04155;font-weight:600}
.b{color:var(--acc);font-weight:600}
/* FOOTER */
.ftr{text-align:center;padding:16px 20px;color:var(--t3);font-size:11px;border-top:1px solid var(--b1);margin-top:4px}
.ftr span{color:var(--t2)}
@media(max-width:700px){
  .main{padding:12px 12px}
  .kg{grid-template-columns:1fr 1fr}
  .cg{grid-template-columns:1fr}
  .hdr-in{height:auto;padding:10px 0;flex-wrap:wrap}
  .srch{width:150px}
}
</style>
</head>
<body>
<div id="ls"><div class="spin"></div><div class="lt">Connecting to Google Sheets…</div></div>

<header class="hdr">
  <div class="hdr-in">
    <div class="logo-wrap">
      <div class="logo">TP</div>
      <div>
        <div class="brand-name">TP Sales Leaderboard 2026</div>
        <div class="brand-sub">Live Performance Dashboard</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="live-pill"><div class="pulse"></div>LIVE</div>
      <span class="upd" id="upd">—</span>
      <button class="rbtn" onclick="init()">⟳ Refresh</button>
    </div>
  </div>
</header>

<div class="mbar"><div class="mbar-in" id="mbar"></div></div>

<main class="main">
  <div id="sec-summary"></div>
  <div id="sec-lb"></div>
  <div id="sec-analytics"></div>
</main>

<footer class="ftr">
  Connected to <span>Google Sheets</span> · Auto-refreshes every 5 min · TP Sales 2026
</footer>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const SID = '18UjuOiSNpJaTmL_Cad3Fc81Nt2oP4pOyTEdkvWtGtwg';
const TABS = ["Jan'26","Feb'26","Mar'26"];
const KEYS = ['Jan26','Feb26','Mar26'];

// ─── STATE ────────────────────────────────────────────────
let DATA = {};
let curM = 'Jan26';
let curT = 'bdm';
let srch = '';

// ─── HELPERS ─────────────────────────────────────────────
const M = ['🥇','🥈','🥉'];
const MC = ['m1','m2','m3'];

function v(n){ return (typeof n==='number'&&!isNaN(n))?n:0; }

function fmt(n){
  n=v(n);
  if(n===0)return '₹0';
  if(n>=10000000)return '₹'+(n/10000000).toFixed(2)+'Cr';
  if(n>=100000)return '₹'+(n/100000).toFixed(1)+'L';
  if(n>=1000)return '₹'+(n/1000).toFixed(1)+'K';
  return '₹'+Math.round(n).toLocaleString('en-IN');
}
function fmtN(n){ n=v(n); return Math.round(n).toLocaleString('en-IN'); }
function pct(n){ return v(n)>=1?'100.0%':(v(n)*100).toFixed(1)+'%'; }
function achColor(p){ p=v(p); return p>=1?'#00c896':p>=0.8?'#f5a020':p>=0.6?'#f5c842':'#f04155'; }
function slK(s){
  if(!s)return'R';
  if(s==='Regular')return'R';
  if(s==='Acting AM')return'A';
  if(s==='Device Tgt')return'D';
  if(s==='PIP')return'P';
  if(s==='Warning')return'W';
  if(s==='New')return'N';
  if(s==='Inside Sales')return'I';
  if(s==='Institution')return'In';
  return'R';
}
function slLabel(s){ return s||'Regular'; }
function prog(val,max){
  const p=max>0?Math.min(100,v(val)/v(max)*100):0;
  const c=achColor(max>0?v(val)/v(max):0);
  return `<div class="pg"><div class="pg-bg"><div class="pg-f" style="width:${p.toFixed(1)}%;background:${c}"></div></div><span class="pg-l" style="color:${c}">${Math.round(p)}%</span></div>`;
}

// ─── CSV FETCH & PARSE ────────────────────────────────────
async function fetchCSV(name){
  const url=`https://docs.google.com/spreadsheets/d/${SID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(name)}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('HTTP '+r.status+' for sheet '+name);
  return r.text();
}

function parseCSV(txt){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(c==='"'){ if(q&&txt[i+1]==='"'){cell+='"';i++;}else{q=!q;} }
    else if(c===','&&!q){row.push(cell);cell='';}
    else if((c==='\n'||c==='\r')&&!q){
      row.push(cell);rows.push(row);row=[];cell='';
      if(c==='\r'&&txt[i+1]==='\n')i++;
    }
    else cell+=c;
  }
  if(cell||row.length)rows.push([...row,cell]);
  return rows;
}

function pn(v){ const n=parseFloat(String(v||'').replace(/,/g,''));return isNaN(n)?0:n; }

function parseSheet(csv){
  const rows=parseCSV(csv);
  if(!rows||rows.length<2) return null;
  // Row 0 = headers. Confirmed col indices:
  // 0=Slab,1=AMTag,2=SrNo,3=Name,4=Location,5=Target
  // 7=SAAS,8=CP,9=OPD,10=Dx,11=Pillup,12=Nutra,13=Strip,14=CGM
  // 15=Core,16=Txn,17=Other,18=TotalRev,19=CorePct
  const BDM_SL=new Set(['Regular','Acting AM','Device Tgt','PIP','Warning','New','Institution']);
  const bdm=[],inside=[],am=[],rm=[],products=[];
  let summary=null;
  let amHdrRow=-1,rmHdrRow=-1,prodHdrRow=-1;

  // First pass: find section headers
  for(let i=0;i<rows.length;i++){
    const r=rows[i];
    const c2=(r[2]||'').trim();
    if(c2==='AM'&&!(r[3]||'').trim()) amHdrRow=i;
    if(c2==='RM'&&!(r[3]||'').trim()) rmHdrRow=i;
    if(c2==='Product') prodHdrRow=i;
  }

  // Second pass: parse each section
  for(let i=1;i<rows.length;i++){
    const r=rows[i];
    const slab=(r[0]||'').trim();
    const amTag=(r[1]||'').trim();
    const srNo=(r[2]||'').trim();
    const name=(r[3]||'').trim();
    const loc=(r[4]||'').trim();

    // BDM section (rows before AM header)
    if(amHdrRow>0 && i<amHdrRow){
      if(BDM_SL.has(slab) && name){
        bdm.push({
          name,am:amTag,location:loc,slab,
          target:pn(r[5]),
          saas:pn(r[7]),cp:pn(r[8]),opd:pn(r[9]),dx:pn(r[10]),
          pillup:pn(r[11]),nutra:pn(r[12]),strip:pn(r[13]),cgm:pn(r[14]),
          coreRevenue:pn(r[15]),transactionRevenue:pn(r[16]),
          otherRevenue:pn(r[17]),totalRevenue:pn(r[18]),
          coreContributionPct:pn(r[19])
        });
      }
      if(slab==='Inside Sales' && name){
        inside.push({
          name,am:amTag,location:loc,slab,
          target:pn(r[5]),
          coreRevenue:pn(r[15]),transactionRevenue:pn(r[16]),
          otherRevenue:pn(r[17]),totalRevenue:pn(r[18]),
          coreContributionPct:pn(r[19])
        });
      }
      if(slab==='-' && name==='Total Revenue'){
        summary={
          target:pn(r[5]),coreRevenue:pn(r[15]),
          transactionRevenue:pn(r[16]),otherRevenue:pn(r[17]),totalRevenue:pn(r[18])
        };
      }
    }

    // AM section
    if(amHdrRow>0 && rmHdrRow>0 && i>amHdrRow && i<rmHdrRow){
      if(slab!=='# of BDMs' && name && name!=='Total Revenue'){
        am.push({
          name,rm:amTag,location:loc,
          numBDMs:parseInt(slab)||0,
          target:pn(r[5]),cgm:pn(r[14]),
          coreRevenue:pn(r[15]),transactionRevenue:pn(r[16]),
          otherRevenue:pn(r[17]),totalRevenue:pn(r[18]),
          revenuePerBDM:pn(r[19])
        });
      }
    }

    // RM section
    if(rmHdrRow>0 && i>rmHdrRow && (prodHdrRow<0||i<prodHdrRow)){
      if(slab!=='# of BDMs' && name && name!=='Total Revenue'){
        rm.push({
          name,rm:amTag,location:loc,
          numBDMs:parseInt(slab)||0,
          target:pn(r[5]),cgm:pn(r[14]),
          coreRevenue:pn(r[15]),transactionRevenue:pn(r[16]),
          otherRevenue:pn(r[17]),totalRevenue:pn(r[18]),
          revenuePerBDM:pn(r[19])
        });
      }
    }

    // Products section
    if(prodHdrRow>0 && i>prodHdrRow){
      const pname=(r[2]||'').trim();
      if(pname&&pname!=='Product'&&pname!=='Total'){
        const units=pn(r[3]),rev=pn(r[4]),aov=pn(r[5]);
        if(units>0||rev>0) products.push({product:pname,units:Math.round(units),revenue:rev,aov});
      }
    }
  }

  // Fallback summary from totals
  if(!summary){
    const allRev=[...bdm,...inside];
    summary={
      target:allRev.reduce((a,b)=>a+b.target,0),
      coreRevenue:allRev.reduce((a,b)=>a+b.coreRevenue,0),
      transactionRevenue:allRev.reduce((a,b)=>a+b.transactionRevenue,0),
      otherRevenue:allRev.reduce((a,b)=>a+b.otherRevenue,0),
      totalRevenue:allRev.reduce((a,b)=>a+b.totalRevenue,0),
    };
  }
  return {bdm,inside,am,rm,summary,products};
}

// ─── LOAD ─────────────────────────────────────────────────
async function init(){
  document.getElementById('ls').classList.remove('hide');
  document.getElementById('upd').textContent='Fetching…';
  try{
    const fetches=TABS.map(t=>fetchCSV(t));
    const results=await Promise.allSettled(fetches);
    DATA={};
    results.forEach((r,i)=>{
      if(r.status==='fulfilled'){
        const p=parseSheet(r.value);
        if(p) DATA[KEYS[i]]=p;
      } else {
        console.warn('Failed to fetch '+TABS[i],r.reason);
      }
    });
    if(!Object.keys(DATA).length) throw new Error('No sheets loaded');
    const now=new Date();
    document.getElementById('upd').textContent=
      'Updated '+now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})+
      ' · '+now.toLocaleDateString('en-IN',{day:'2-digit',month:'short'});
  } catch(e){
    console.error(e);
    DATA=FALLBACK;
    document.getElementById('upd').textContent='Offline · cached data';
  }
  document.getElementById('ls').classList.add('hide');
  if(!DATA[curM]) curM=Object.keys(DATA)[0]||'Jan26';
  renderAll();
}

// ─── CUMULATIVE ────────────────────────────────────────────
function buildCum(){
  const mks=Object.keys(DATA);
  const ab={},ai={},aa={},ar={};
  let cs={target:0,coreRevenue:0,transactionRevenue:0,otherRevenue:0,totalRevenue:0};
  let cp={};
  mks.forEach(mk=>{
    const d=DATA[mk];
    for(const k in cs) cs[k]+=v(d.summary[k]);
    // products: merge by name
    (d.products||[]).forEach(p=>{
      if(!cp[p.product]) cp[p.product]={product:p.product,units:0,revenue:0,aov:0};
      cp[p.product].units+=p.units;
      cp[p.product].revenue+=p.revenue;
    });
    d.bdm.forEach(r=>{
      if(!ab[r.name]) ab[r.name]={...r};
      else{ ab[r.name].target+=v(r.target);ab[r.name].totalRevenue+=v(r.totalRevenue);ab[r.name].coreRevenue+=v(r.coreRevenue);ab[r.name].transactionRevenue+=v(r.transactionRevenue);ab[r.name].otherRevenue+=v(r.otherRevenue); }
    });
    d.inside.forEach(r=>{
      if(!ai[r.name]) ai[r.name]={...r};
      else{ ai[r.name].target+=v(r.target);ai[r.name].totalRevenue+=v(r.totalRevenue);ai[r.name].coreRevenue+=v(r.coreRevenue); }
    });
    d.am.forEach(r=>{
      if(!aa[r.name]) aa[r.name]={...r};
      else{ aa[r.name].target+=v(r.target);aa[r.name].totalRevenue+=v(r.totalRevenue);aa[r.name].coreRevenue+=v(r.coreRevenue);aa[r.name].transactionRevenue+=v(r.transactionRevenue);aa[r.name].otherRevenue+=v(r.otherRevenue); }
    });
    d.rm.forEach(r=>{
      if(!ar[r.name]) ar[r.name]={...r};
      else{ ar[r.name].target+=v(r.target);ar[r.name].totalRevenue+=v(r.totalRevenue);ar[r.name].coreRevenue+=v(r.coreRevenue);ar[r.name].transactionRevenue+=v(r.transactionRevenue);ar[r.name].otherRevenue+=v(r.otherRevenue); }
    });
  });
  // Recalculate derived fields
  Object.values(ab).forEach(r=>{ r.coreContributionPct=v(r.totalRevenue)>0?v(r.coreRevenue)/v(r.totalRevenue):0; });
  Object.values(aa).forEach(r=>{ r.revenuePerBDM=v(r.numBDMs)>0?v(r.totalRevenue)/v(r.numBDMs):0; });
  Object.values(ar).forEach(r=>{ r.revenuePerBDM=v(r.numBDMs)>0?v(r.totalRevenue)/v(r.numBDMs):0; });
  // Products recalc aov
  Object.values(cp).forEach(p=>{ p.aov=p.units>0?p.revenue/p.units:0; });
  return {bdm:Object.values(ab),inside:Object.values(ai),am:Object.values(aa),rm:Object.values(ar),summary:cs,products:Object.values(cp).filter(p=>p.revenue>0),_cum:true};
}

function D(){ return curM==='CUM'?buildCum():DATA[curM]; }
